version: 2

models:
  - name: stg_order_items
    description: 注文明細のID・商品ID・数量を標準化するステージングモデル。
    columns:
      - name: order_id
        description: 明細が属する注文のID。
        tests:
          - not_null
      - name: product_id
        description: 明細の商品ID。
        tests:
          - not_null
      - name: quantity
        description: 注文された数量。
        tests:
          - not_null
  - name: stg_products
    description: 商品マスタの列名を標準化するステージングモデル。
    columns:
      - name: product_id
        description: 商品を識別するID。
        tests:
          - unique
          - not_null
      - name: price
        description: 商品の単価。
        tests:
          - not_null
  - name: stg_stores
    description: 店舗マスタの列名を標準化するステージングモデル。
    columns:
      - name: store_id
        description: 店舗を識別するID。
        tests:
          - unique
          - not_null
