version: 2

models:
  - name: dim_products
    description: "商品に関するディメンションテーブルです。商品の基本情報（商品名、カテゴリ、価格など）を提供します。商品分析の基礎となります。"
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
      name: cafe_products
    columns:
      - name: product_key
        description: "商品を一意に識別する代理キーです。dbt_utils.generate_surrogate_keyによって生成されます。"
        data_type: VARCHAR
        entity:
          type: primary
          name: product
        tests:
          - unique
          - not_null
      - name: product_id
        description: "元のデータソースにおける商品IDです。"
        data_type: BIGINT
      - name: product_name
        description: "商品の名称です。"
        data_type: VARCHAR
        dimension:
          type: categorical
      - name: category
        description: "商品のカテゴリです（例: ドリンク、フード、グッズなど）。"
        data_type: VARCHAR
        dimension:
          type: categorical
      - name: price
        description: "商品の単価です。"
        data_type: BIGINT
      - name: is_customizable
        description: "商品がカスタマイズ可能かどうかを示すフラグです（True/False）。"
        data_type: BOOLEAN
        dimension:
          type: categorical
